spring.application.name=wms

# No default in-memory user (it logs a generated password). Real users come from the DB in task 4.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# SEC-67: finish in-flight requests on shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# SEC-63: never leak internals from the fallback /error page
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.pattern.level=%5p [%X{cid:-}]

# Database. Passwords come only from env vars (SEC-80); same names as deploy/.env.
# Dev: open an SSH tunnel first (localhost:3308 -> server wms-mysql).
spring.datasource.url=jdbc:mysql://${WMS_DB_HOST:localhost}:${WMS_DB_PORT:3308}/wms?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=wms_app
spring.datasource.password=${WMS_APP_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
# SEC-27: schema changes run as a separate user
spring.flyway.user=wms_flyway
spring.flyway.password=${WMS_FLYWAY_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# SEC-02: RS256 key pair, PEM files outside Git. Server: WMS_KEYS_DIR=/opt/wms/keys
wms.jwt.private-key=file:${WMS_KEYS_DIR:../keys}/jwt.key
wms.jwt.public-key=file:${WMS_KEYS_DIR:../keys}/jwt.pub
