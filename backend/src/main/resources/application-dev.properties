# Dev profile: emails go to the local Mailpit container (docker compose --profile dev up -d mailpit), read them at
# http://localhost:8025. In production set SPRING_MAIL_HOST / SPRING_MAIL_PORT / SPRING_MAIL_USERNAME /
# SPRING_MAIL_PASSWORD and WMS_MAIL_FROM for the chosen email provider.
spring.mail.host=localhost
spring.mail.port=1025
