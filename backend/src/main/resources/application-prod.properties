# Production (v1.0 task 9). Start with SPRING_PROFILES_ACTIVE=prod. Everything here adds to application.properties.
# Secrets still come only from environment variables (SEC-80): WMS_APP_PASSWORD, WMS_FLYWAY_PASSWORD.

# Nginx is the only way in: the app listens on localhost only.
server.address=127.0.0.1
server.port=${WMS_PORT:8080}

# SEC-66 / review v0.1 F12: Actuator on its own localhost-only port, never reachable through Nginx.
management.server.address=127.0.0.1
management.server.port=${WMS_MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# SEC-64: a log file that rotates (20 MB a file, 14 days, at most 1 GB); the console still goes to journald.
logging.file.name=${WMS_LOG_FILE:/var/log/wms/wms.log}
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=1GB
logging.logback.rollingpolicy.clean-history-on-start=true

# Production places on the server.
wms.files.dir=${WMS_FILES_DIR:/var/lib/wms/files}
wms.jwt.private-key=file:${WMS_KEYS_DIR:/opt/wms/keys}/jwt.key
wms.jwt.public-key=file:${WMS_KEYS_DIR:/opt/wms/keys}/jwt.pub

# Invite links point here. No default on purpose: a forgotten setting stops the start instead of mailing
# localhost links to real users.
wms.app.base-url=${WMS_APP_BASE_URL}

# No Swagger/OpenAPI: springdoc is not in the build (NoSwaggerTest keeps it that way).
