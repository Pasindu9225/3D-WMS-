# CI for every push and pull request (docs/SPEC.md v0.1 task 9).
# Third-party actions are pinned to full commit SHAs (tag in the comment) so a moved tag cannot
# run new code here. Versions are about a month old on purpose: stable, not newest.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # least privilege: no job writes to the repo

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests + ArchUnit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Unit, integration (Testcontainers MySQL 8.4 on the runner's Docker) and ArchUnit rules.
      - run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend (lint, tests, build, size)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Bundle budget (admin initial JS < 400 KB gzip)
        run: npm run size
      - name: npm audit (fail on high or critical, SEC-81)
        run: npm audit --audit-level=high

  secrets:
    name: Secret scan (gitleaks, SEC-80)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency scan (OSV, SEC-81)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # pom.xml alone hides most versions (the Spring Boot parent manages them), so OSV could not
      # check them. A CycloneDX SBOM lists every runtime library, transitive ones included, with
      # its exact version (about 100 instead of 3). Test-only libraries are left out: they never ship.
      - name: Backend SBOM
        working-directory: backend
        run: ./mvnw -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom -DincludeTestScope=false -DoutputFormat=json -DoutputName=bom
      # Known vulnerabilities in Maven and npm packages; any finding fails the build.
      # Accepted findings, if ever needed, go in osv-scanner.toml with a reason and an expiry date.
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=backend/target/bom.json
            --lockfile=frontend/package-lock.json
