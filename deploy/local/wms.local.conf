# Local rehearsal of the server's nginx (no server yet): same rules (wms-common.conf), a self-signed certificate,
# and the backend running on this PC instead of 127.0.0.1 inside the container.

upstream wms_app {
    server host.docker.internal:8080;
}

server {
    listen 8088;
    server_tokens off;
    location / { return 301 https://$host:8443$request_uri; }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/local.crt;
    ssl_certificate_key /etc/nginx/certs/local.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    include /etc/nginx/snippets/wms-common.conf;
}
