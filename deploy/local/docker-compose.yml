# Local rehearsal of the production front door (no server yet). From this folder:
#   1. build the web app:   (cd ../../frontend && npm run build)
#   2. make a certificate:  sh make-cert.sh
#   3. start:               docker compose up -d     -> https://localhost:8443
# The backend runs on this PC as usual (port 8080). Ports 8443/8088 are used by nothing else here.
services:
  nginx:
    image: nginx:1.27.5-alpine
    container_name: wms-nginx-local
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8088:8088"
    volumes:
      - ./wms.local.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/wms-common.conf:/etc/nginx/snippets/wms-common.conf:ro
      - ../nginx/wms-headers.conf:/etc/nginx/snippets/wms-headers.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ../../frontend/dist:/var/www/wms:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 64m
