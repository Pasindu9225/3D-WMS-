# Shared by the server (wms.conf) and the local rehearsal (local/wms.local.conf). Included inside a server block
# that defines TLS and an upstream called wms_app (the Spring Boot app on 127.0.0.1:8080).

server_tokens off;                       # SEC-64: no nginx version
client_max_body_size 6m;                 # product pictures are at most 5 MB (SEC-40)
client_body_timeout 15s;
client_header_timeout 15s;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
gzip_min_length 1024;

include /etc/nginx/snippets/wms-headers.conf;   # SEC-61, same headers as the API

root /var/www/wms;
index index.html;

# Review v0.1 F12: Actuator is for the server itself only (it listens on 127.0.0.1:8081 anyway).
location /actuator { return 404; }

# The API. The backend sets its own security headers; nginx must not add a second copy.
location /api/ {
    proxy_pass http://wms_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;                                   # review v0.1: keep Host
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # real client IP for rate limits
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_buffering off;                                           # exports stream straight through
}

# Live 3D updates (STOMP over WebSocket).
location = /ws {
    proxy_pass http://wms_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
}

# Hashed build files never change: cache a year. (add_header in a location drops the server ones, so include them again.)
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/wms-headers.conf;
    try_files $uri =404;
}

# The page, the service worker and the app manifest must always be fresh, or a new release is not picked up.
location ~ ^/(index\.html|sw\.js|manifest\.webmanifest|theme-init\.js|robots\.txt)$ {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/wms-headers.conf;
}

# Everything else is a page of the single-page app.
location / {
    try_files $uri /index.html;
}
