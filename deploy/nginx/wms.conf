# The server's site file: /etc/nginx/sites-available/wms (link it into sites-enabled). Replace wms.example.lk with
# the real name, then: certbot --nginx -d wms.example.lk (Let's Encrypt renews itself, SEC-66).

upstream wms_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

# SEC-66: plain HTTP only redirects (and answers the Let's Encrypt challenge).
server {
    listen 80;
    listen [::]:80;
    server_name wms.example.lk;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wms.example.lk;

    ssl_certificate     /etc/letsencrypt/live/wms.example.lk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wms.example.lk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:WMS:10m;
    ssl_session_tickets off;

    include /etc/nginx/snippets/wms-common.conf;
}
