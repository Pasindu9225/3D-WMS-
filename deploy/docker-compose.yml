# WMS database: its own container, volume and users. Never shares the BMS container.
# Run from this folder: docker compose up -d --wait
services:
  mysql:
    build: ./mysql
    image: wms-mysql:8.4
    container_name: wms-mysql
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=${WMS_DB_BUFFER_POOL:-512M}
      - --max-connections=50
      - --performance-schema=OFF   # saves ~200-400 MB RAM on low-spec servers
      - --skip-log-bin             # no replication; lets Flyway create ledger guard triggers
    ports:
      - "127.0.0.1:3308:3306"      # localhost only; reach it from your PC with an SSH tunnel
    volumes:
      - wms-mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    mem_limit: ${WMS_DB_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Development only: catches every email the app sends (sign-up links) and shows it at http://localhost:8025.
  # Nothing reaches real inboxes. Start it with: docker compose up -d mailpit
  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: wms-mailpit
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - "127.0.0.1:8025:8025"      # web inbox
      - "127.0.0.1:1025:1025"      # SMTP the backend sends to
    mem_limit: 64m

volumes:
  wms-mysql-data:
